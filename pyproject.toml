[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raw2dng"
version = "0.1.0"
description = "Convert camera RAW files to Adobe DNG (thin CLI over dnglab)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "dahli4" }]
keywords = ["raw", "dng", "photography", "converter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = []

[project.scripts]
raw2dng = "raw2dng.cli:main"

[project.urls]
Homepage = "https://github.com/dahli4/raw2dng"
Repository = "https://github.com/dahli4/raw2dng"

[tool.setuptools.packages.find]
where = ["src"]
